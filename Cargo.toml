[package]
name = "dmxpress"
version = "0.1.3"
edition = "2021"
license = "MPL-2.0"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.29"
crossbeam-channel = "0.5"
parking_lot = "0.12"
anyhow = "1"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
# Only used to decode the embedded logo at startup.
image = { version = "0.25", default-features = false, features = ["png"] }
# Unpacks the bundled fixture library, which is ~14 MB of JSON and compresses
# to under 1. Already in the tree as an `image` dependency.
flate2 = "1"
# Unpacks the bundled gobo catalogue (`fixtures/gobos.tar.gz`, see `gobo.rs`).
tar = "0.4"
# Audio-reactive triggers: capture (incl. WASAPI loopback) and spectrum.
cpal = "0.15"
realfft = "3"
dirs = "5"
# Elgato Stream Deck hardware control surface (Palettes tab).
elgato-streamdeck = "0.13"
# Anti-aliased text on the Stream Deck keys/strip (same crate epaint uses).
ab_glyph = "0.2"
# Sandboxed plugin scripts: layers, custom windows and theme tints (plugin.rs).
rhai = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
