[package]
name = "gobo-pack"
version = "0.1.0"
edition = "2021"
publish = false
description = "Builds fixtures/gobos.tar.gz, DMXpress's gobo mask catalogue, from QLC+ and OFL"

# Deliberately its own crate: the app never rasterizes SVG, so resvg and its
# dependency tree stay out of the DMXpress binary.
[workspace]

[dependencies]
resvg = "0.48"
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"

[profile.release]
opt-level = 3
